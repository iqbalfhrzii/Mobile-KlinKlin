name: iOS Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build iOS (No Sign)
        run: |
          flutter build ios --release --no-codesign
          
      - name: Compress iOS App
        run: |
          cd build/ios/iphoneos
          tar -zcvf ios-app.tar.gz Runner.app
          
      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ios-app-release
          path: build/ios/iphoneos/ios-app.tar.gz
