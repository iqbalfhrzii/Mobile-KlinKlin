name: iOS Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Flutter & Precache iOS
        run: |
          flutter config --no-enable-swift-package-manager
          flutter precache --ios
          flutter doctor -v

      - name: Clean stale local iOS artifacts
        run: |
          rm -f ios/Flutter/Generated.xcconfig
          rm -f ios/Flutter/flutter_export_environment.sh
          rm -rf ios/Flutter/ephemeral
          rm -rf ios/Pods
          rm -f ios/Podfile.lock
          rm -rf ios/.symlinks

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build iOS (No Sign)
        run: |
          flutter build ios --release --no-codesign --verbose

      - name: Create Unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ios-app-unsigned.ipa Payload
          
      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-release
          path: build/ios/iphoneos/ios-app-unsigned.ipa
